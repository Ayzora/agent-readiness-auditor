<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; }
      .hero { display: block; width: 100%; }
    </style>
  </head>
  <body>
    <!-- An image-only shell: markup and assets, not one word of text. -->
    <div class="hero">
      <img src="/hero.png" alt="" />
    </div>
    <div class="gallery">
      <img src="/one.png" alt="" />
      <img src="/two.png" alt="" />
    </div>
    <script>
      document.querySelector(".hero").classList.add("ready");
    </script>
  </body>
</html>
