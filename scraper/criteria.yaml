# Every key must match a criterionKey a check emits.
# effort: S | M | L. thresholds: the cutoffs the check compares against.
# required_properties: the per-type property paths semantics.required_properties judges.

version: v0.1.0

criteria:
  - key: access.robots_allows_agents
    dimension: access
    scope: site
    weight: 10
    severity: critical
    effort: S
    title: "robots.txt blocks AI agents"
    why: >
      Agents that respect robots.txt will not read a page it disallows, so a
      blocked agent cannot answer questions about your site.
    fix: "Add Allow rules in robots.txt for the agents you want to reach you"

  - key: access.policy_divergence
    dimension: access
    scope: page
    weight: 10
    severity: critical
    effort: S
    title: "robots.txt allows agents that your server then blocks"
    why: >
      robots.txt says these agents are welcome, but the page answered them
      with a challenge or an error. Usually a bot-protection setting nobody
      compared against robots.txt.
    fix: "Allowlist these agents in your CDN or bot-protection settings"

  - key: access.pay_per_crawl
    dimension: access
    scope: page
    weight: 3
    severity: low
    effort: S
    title: "Agents are asked to pay to read this page"
    why: >
      A 402 response is a deliberate commercial choice, not a mistake. Agents
      that do not pay will not see the content.
    fix: "Confirm pay-per-crawl is intended for these agents"

  - key: access.baseline_mismatch
    dimension: access
    scope: page
    weight: 7
    severity: high
    effort: M
    thresholds:
      fail: 0.1 # text length differs from the baseline by more than 10%
    title: "Agents see different content from a normal visitor"
    why: >
      The text an agent received differs noticeably from what a browser
      received, so agents may be describing a page that is not really yours.
    fix: "Serve agents the same content as other visitors"

  - key: access.rate_limit
    dimension: access
    scope: site
    weight: 3
    severity: low
    effort: S
    title: "The site rate-limits at a low request rate"
    why: >
      Agents that fetch several pages to answer one question can be cut off
      before they finish.
    fix: "Raise the rate limit for verified agent traffic"

  - key: access.sitemap_present
    dimension: access
    scope: site
    weight: 4
    severity: medium
    effort: S
    title: "No sitemap, or it is not listed in robots.txt"
    why: "A sitemap is how agents find pages that are not linked from the homepage."
    fix: "Publish /sitemap.xml and reference it with a Sitemap: line in robots.txt"

  - key: access.sitemap_freshness
    dimension: access
    scope: site
    weight: 2
    severity: low
    effort: S
    thresholds:
      warn: 90 # days since the newest lastmod
    title: "Sitemap has not been updated recently"
    why: "Stale lastmod dates tell agents nothing has changed, so they may skip new content."
    fix: "Regenerate the sitemap with accurate lastmod dates when pages change"

  - key: render.text_coverage
    dimension: render
    scope: page
    weight: 9
    severity: critical
    effort: L
    thresholds:
      # raw text ÷ rendered text
      fail: 0.3
      warn: 0.6
    title: "Content requires JavaScript to appear"
    why: >
      Many agents fetch raw HTML without executing JavaScript. If most of your
      text only appears after render, they see an empty page.
    fix: "Server-render primary content, or provide a static fallback"

  - key: render.empty_rendered_page
    dimension: render
    scope: page
    weight: 8
    severity: critical
    effort: M
    title: "Page has almost no text even after JavaScript runs"
    why: "There is nothing for any agent to read, with or without a browser."
    fix: "Check the page loads correctly and is not blocked by an error or login"

  - key: render.js_redirect
    dimension: render
    scope: page
    weight: 6
    severity: high
    effort: S
    title: "Page redirects with JavaScript"
    why: >
      Agents that do not run JavaScript stay on the original URL and never
      reach the page you meant to send them to.
    fix: "Use a server-side 301 or 302 redirect instead"

  - key: render.halves_diverged
    dimension: render
    scope: page
    weight: 6
    severity: high
    effort: M
    title: "Agents with and without JavaScript end up on different pages"
    why: "Two agents asking about the same URL will read different content."
    fix: "Make the server redirect and the browser land on the same URL"

  - key: render.homepage_redirect
    dimension: render
    scope: page
    weight: 5
    severity: medium
    effort: S
    title: "Page redirects to the homepage"
    why: "The page an agent asked for is replaced with a generic one."
    fix: "Return a real 404, or redirect to the closest matching page"

  - key: render.long_redirect_chain
    dimension: render
    scope: page
    weight: 2
    severity: low
    effort: S
    thresholds:
      warn: 3 # redirect hops
    title: "Three or more redirect hops before the page"
    why: "Each hop costs latency and a chance for an agent to give up."
    fix: "Collapse the chain to a single hop"

  - key: render.soft_404
    dimension: render
    scope: page
    weight: 6
    severity: high
    effort: S
    thresholds:
      fail: 0.8 # word similarity to the site's error page
      # error pages with less text are too empty to compare, so skip
      min_fingerprint_chars: 50
    title: "Page looks like the site's error page but returns 200"
    why: "Agents trust the status code and treat the error page as real content."
    fix: "Return a 404 status for pages that do not exist"

  - key: render.hidden_but_present
    dimension: render
    scope: page
    weight: 2
    severity: low
    effort: S
    thresholds:
      warn: 10 # percent of DOM text hidden by CSS
    title: "A large share of the page's text is hidden"
    why: >
      Agents that read the HTML see hidden text as normal content, so what they
      summarise may differ from what visitors see.
    fix: "Remove hidden text that is not meant to be read"

  - key: render.images_missing_alt
    dimension: render
    scope: page
    weight: 4
    severity: medium
    effort: S
    thresholds:
      warn: 10 # percent of images with no alt attribute at all
      fail: 40
    title: "Images are missing alt text"
    why: "Agents cannot see images; alt text is the only description they get."
    fix: "Add descriptive alt attributes to meaningful images"

  - key: render.canvas_content
    dimension: render
    scope: page
    weight: 3
    severity: medium
    effort: M
    thresholds:
      # page text below which the canvas is the content
      min_text_chars: 500
      min_width: 400
      min_height: 300
    title: "Main content is drawn in a canvas"
    why: "Text drawn in a <canvas> is pixels, not text, and agents cannot read it."
    fix: "Provide the same content as HTML text alongside the canvas"

  - key: render.iframe_primary_content
    dimension: render
    scope: page
    weight: 4
    severity: medium
    effort: M
    thresholds:
      # parent page text below which the frame is the content
      min_text_chars: 500
      min_width: 400
      min_height: 300
      # percent width or height that counts as filling the container
      fills_container_percent: 50
    title: "Main content lives inside an iframe"
    why: "Many agents do not follow iframes, so they miss the content inside."
    fix: "Put primary content directly in the page's HTML"

  - key: render.content_behind_interaction
    dimension: render
    scope: page
    weight: 5
    severity: medium
    effort: M
    thresholds:
      fail: 10 # percent text growth after clicking "load more"
    title: "Content only appears after clicking"
    why: "Agents rarely click tabs, accordions or 'load more' buttons."
    fix: "Include the content in the HTML and use CSS or <details> to collapse it"

  - key: render.infinite_scroll
    dimension: render
    scope: page
    weight: 4
    severity: medium
    effort: M
    thresholds:
      fail: 10 # percent text growth after scrolling, with no page links
    title: "Content loads on scroll with no page links"
    why: "Agents do not scroll, so everything past the first batch is unreachable."
    fix: "Add paginated URLs (?page=2) linked from the page"

  - key: render.consent_wall
    dimension: render
    scope: page
    weight: 6
    severity: high
    effort: M
    thresholds:
      fail: 30 # percent of body text only visible after accepting
    title: "Content is hidden until cookies are accepted"
    why: "Agents do not click consent banners, so they only see the banner."
    fix: "Render page content behind the banner, not after it is accepted"

  - key: structure.extraction_ratio
    dimension: structure
    scope: page
    weight: 6
    severity: high
    effort: M
    thresholds:
      warn: 0.5
      fail: 0.25
    title: "Most of the page's text is menus and page chrome"
    why: >
      An agent reads and pays for every word on the page, and reader-style
      extraction may miss the real content among the chrome.
    fix: "Put primary content in a clear main content region and trim repeated chrome"

  - key: structure.link_navigation
    dimension: structure
    scope: page
    weight: 7
    severity: high
    effort: S
    thresholds:
      warn: 10
      fail: 30
    title: "Links an agent cannot follow"
    why: >
      Agents navigate by following href URLs. Links written as #, javascript:
      or inline click handlers lead nowhere, so those routes through the site
      simply do not exist for them.
    fix: "Use <a> elements with real href URLs for navigation"

  - key: semantics.structured_data_present
    dimension: semantics
    scope: page
    weight: 6
    severity: high
    effort: M
    title: "No machine-readable facts about this page"
    why: >
      Agents read a page's structured data before its prose, because it states
      the facts plainly — what this page is, what it costs, who published it —
      with no inference. Without it every fact has to be guessed from the text.
      Search engines and retrieval systems read this data today, and no AI
      provider publicly commits to it, which is why this is weighted
      moderately rather than as a critical failure.
    fix: "Add a JSON-LD block to the page's HTML describing what the page is"

  - key: semantics.structured_data_parses
    dimension: semantics
    scope: page
    weight: 5
    severity: high
    effort: S
    title: "Structured data is present but broken"
    why: >
      A block that is not valid JSON is discarded whole by every reader, so
      markup that was written, shipped and maintained delivers nothing.
    fix: "Fix the JSON syntax error so the block parses"

  - key: semantics.required_properties
    dimension: semantics
    scope: page
    weight: 5
    severity: medium
    effort: S
    # A hand-written subset of schema.org, not the vocabulary itself. A type
    # absent from here is reported as unknown and costs the page nothing.
    # Paths: a dot walks into a nested object, [] means every member of that
    # array must satisfy the rest of the path.
    required_properties:
      Product: [name, offers.price, offers.availability]
      Organization: [name, url, sameAs]
      Article: [headline, datePublished, author]
      NewsArticle: [headline, datePublished, author]
      BlogPosting: [headline, datePublished, author]
      FAQPage: ["mainEntity[].name", "mainEntity[].acceptedAnswer"]
      Event: [name, startDate, location]
      LocalBusiness: [name, address, telephone]
    title: "Structured data is declared but not filled in"
    why: >
      A type with no properties tells an agent what kind of thing the page is
      but none of the facts about it. A Product with no price and no
      availability leaves an agent doing exactly the guesswork the markup was
      meant to remove.
    fix: "Add the missing properties named in this report to each entity"

  # scope: document — the subject is one linked file, fetched once per run
  # however many pages link it, so its finding's url is the file's own.
  - key: documents.reachable
    dimension: documents
    scope: document
    weight: 7
    severity: high
    effort: S
    title: "This document could not be fetched"
    why: >
      An agent that follows this link receives a login page, an error or
      nothing at all, so the document might as well not be published.
    fix: "Make the document publicly fetchable, or remove the link"

  - key: documents.html_equivalent
    dimension: documents
    scope: document
    weight: 8
    severity: high
    effort: M
    thresholds:
      fail: 0.2 # share of the document's text found in the site's HTML
      warn: 0.6
    # The terms that make a linked document a key document, matched as
    # lowercase substrings against its anchor text and filename. Only key
    # documents are asked whether their content also exists as HTML.
    key_topics:
      [
        pricing,
        price,
        rates,
        tariff,
        spec,
        datasheet,
        terms,
        privacy,
        policy,
        warranty,
        returns,
        shipping,
        menu,
        brochure,
        catalogue,
      ]
    title: "Key information is only available as a PDF"
    why: >
      Retrieval systems read HTML far better than PDF, and many agents fetch a
      page without ever following its document links, so facts that exist only
      inside a file are facts an agent will not have. PDFs are readable by
      some agents, so this is unreliability rather than impossibility.
    fix: "Publish this content as a web page, and keep the PDF as a download"

  - key: documents.text_layer
    dimension: documents
    scope: document
    weight: 7
    severity: high
    effort: L
    thresholds:
      min_chars_per_page: 50 # below this the pages are images, not text
      warn_chars_per_page: 200
    title: "This document is a scan with no readable text"
    why: >
      The file contains an image of text rather than text, so nothing can read
      it — no agent, no search engine and no screen reader.
    fix: "Republish the document with a real text layer, or publish the content as HTML"

  - key: documents.tagged_structure
    dimension: documents
    scope: document
    weight: 3
    severity: low
    effort: M
    title: "This document declares no headings or reading order"
    why: >
      Without tagging, extracted text arrives in whatever order the file
      happens to store it, so columns interleave and headings vanish.
    fix: "Export the document as a tagged PDF"

  - key: documents.size
    dimension: documents
    scope: document
    weight: 2
    severity: low
    effort: M
    thresholds:
      max_bytes_warn: 5242880 # 5 MB
      max_bytes_fail: 20971520 # 20 MB
      max_pages_warn: 50
      max_pages_fail: 200
    title: "This document is large enough that agents will skip it"
    why: >
      A very large file costs an agent most of its budget to read, so it is
      commonly skipped entirely.
    fix: "Split the document, or publish its key sections as HTML"

  - key: provenance.llms_txt
    dimension: provenance
    scope: site
    scored: false
    severity: info
    effort: S
    thresholds:
      min_links: 1
    title: "No llms.txt to guide agents to your content"
    why: >
      An llms.txt lists the pages worth an agent's attention in markdown, so an
      agent spends its budget on your content rather than parsing your
      navigation. Adoption is real — thousands of sites, generated automatically
      by several docs platforms, audited by Lighthouse — but no major AI
      provider commits to reading one, so we report it and do not score it.
    fix: "Publish /llms.txt with an H1 title and links to your key pages as markdown"

# A gate caps the total score when its criterion fails.
gates:
  - criterion: access.robots_allows_agents
    cap: 20
    reason: "robots.txt blocks every AI agent"
